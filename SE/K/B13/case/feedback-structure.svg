<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" role="img" aria-labelledby="t d"><title id="t">Northstar feedback stock and flow architecture</title><desc id="d">Three linked feedback pathways connecting backlog, demand, capacity, maintenance, perceived backlog, and trust. Arrows indicate influence hypotheses, not demonstrated causation.</desc><style>text{font:16px system-ui,sans-serif;fill:#173444}.box{fill:#e7f4f2;stroke:#08756d;stroke-width:2;rx:12}.edge{stroke:#275a75;stroke-width:2;fill:none;marker-end:url(#a)}.note{font-size:12px;fill:#365668}</style><defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#275a75"/></marker></defs><rect class="box" x="30" y="65" width="200" height="60"/><text x="48" y="91">Requests and</text><text x="48" y="113">trust-driven demand</text><rect class="box" x="320" y="65" width="240" height="60"/><text x="340" y="90">Backlogs: standard</text><text x="340" y="111">and accessible</text><rect class="box" x="650" y="65" width="245" height="60"/><text x="668" y="90">Perceived backlog</text><text x="668" y="112">and dispatch surge</text><rect class="box" x="30" y="250" width="200" height="60"/><text x="48" y="276">Trust index</text><text x="48" y="299">and lost demand</text><rect class="box" x="320" y="250" width="240" height="60"/><text x="338" y="277">Active fleet and</text><text x="338" y="299">repair capacity</text><rect class="box" x="650" y="250" width="245" height="60"/><text x="668" y="276">Ride capacity and</text><text x="668" y="299">service completions</text><path class="edge" d="M230 95 H320"/><text class="note" x="259" y="82">+ arrivals</text><path class="edge" d="M560 95 H650"/><text class="note" x="588" y="82">+ delayed</text><path class="edge" d="M760 125 V250"/><text class="note" x="778" y="196">+ surge, + wear</text><path class="edge" d="M650 280 H560"/><text class="note" x="592" y="268">+ service</text><path class="edge" d="M440 250 V125"/><text class="note" x="445" y="201">− backlog</text><path class="edge" d="M320 282 H230"/><text class="note" x="255" y="266">+ availability</text><path class="edge" d="M30 280 Q5 280 5 95 H30"/><text class="note" x="10" y="195">+ demand</text><path class="edge" d="M320 110 Q268 195 125 250"/><text class="note" x="244" y="183">− trust via abandonment</text><text class="note" x="24" y="358">Conceptual influence map: sign conventions are directional hypotheses. See formal equations, stock guards, and uncertainty records.</text></svg>
