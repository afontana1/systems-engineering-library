<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-labelledby="t d"><title id="t">Test and evaluation evidence chain</title><desc id="d">Requirement to test procedure to observation and uncertainty to applicable evidence to acceptance authority.</desc><rect width="900" height="170" fill="#f6faf9"/><g font-family="system-ui,sans-serif" font-size="16" text-anchor="middle"><rect x="20" y="48" width="150" height="66" rx="8" fill="#d9eeea" stroke="#0e6570"/><text x="95" y="78">Requirement</text><text x="95" y="99" font-size="12">and scenario</text><rect x="205" y="48" width="150" height="66" rx="8" fill="#d9eeea" stroke="#0e6570"/><text x="280" y="78">Procedure</text><text x="280" y="99" font-size="12">and test article</text><rect x="390" y="48" width="150" height="66" rx="8" fill="#d9eeea" stroke="#0e6570"/><text x="465" y="78">Measurements</text><text x="465" y="99" font-size="12">and uncertainty</text><rect x="575" y="48" width="150" height="66" rx="8" fill="#d9eeea" stroke="#0e6570"/><text x="650" y="78">Evidence</text><text x="650" y="99" font-size="12">and applicability</text><rect x="760" y="48" width="120" height="66" rx="8" fill="#f8dfcf" stroke="#a04d27"/><text x="820" y="78">Decision</text><text x="820" y="99" font-size="12">authority</text></g><g stroke="#32696b" stroke-width="3" fill="none"><path d="M170 81 H205 M355 81 H390 M540 81 H575 M725 81 H760"/></g></svg>