<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc"><title id="title">NS-DA14.1 separated selection and design evidence paths</title><desc id="desc">Two decision paths share a governance stage. Pilot alternatives and assumed preferences lead to conditional selection; morphology and a nonvalidated response model lead to a finite search and robust challenge. Both require independent qualification before real use.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#236c80"/></marker></defs><rect width="1120" height="540" fill="#f4fafb"/><text x="55" y="48" fill="#173f52" font-family="sans-serif" font-size="27" font-weight="bold">NS-DA14.1: evidence ≠ preference ≠ approval</text><text x="60" y="85" fill="#345a68" font-family="sans-serif" font-size="17">Project 1: pilot selection</text><text x="612" y="85" fill="#345a68" font-family="sans-serif" font-size="17">Project 2: scalable service design</text>
<g font-family="sans-serif" font-size="17" text-anchor="middle"><rect x="45" y="110" width="220" height="82" rx="12" fill="#e2f4ef" stroke="#2b7e6e"/><text x="155" y="144" fill="#153d48">Six course-defined</text><text x="155" y="170" fill="#153d48">pilot attributes</text><rect x="325" y="110" width="228" height="82" rx="12" fill="#fcefdc" stroke="#b07727"/><text x="439" y="144" fill="#153d48">Assumed gates,</text><text x="439" y="170" fill="#153d48">weights, beliefs</text><rect x="55" y="250" width="490" height="87" rx="12" fill="#e6f1fa" stroke="#467a9f"/><text x="300" y="284" fill="#153d48">Feasible C/D + Pareto + swing reversal</text><text x="300" y="314" fill="#153d48">EVPI / EVSI policy learning</text><rect x="605" y="110" width="220" height="82" rx="12" fill="#e2f4ef" stroke="#2b7e6e"/><text x="715" y="143" fill="#153d48">Architecture and</text><text x="715" y="170" fill="#153d48">parametric grid</text><rect x="858" y="110" width="220" height="82" rx="12" fill="#fcefdc" stroke="#b07727"/><text x="968" y="143" fill="#153d48">Synthetic response</text><text x="968" y="170" fill="#153d48">formula (not field)</text><rect x="607" y="250" width="468" height="87" rx="12" fill="#e6f1fa" stroke="#467a9f"/><text x="841" y="284" fill="#153d48">1440 points → 10 nominal feasible</text><text x="841" y="314" fill="#153d48">5 efficient; DOE / holdout / stress</text><rect x="266" y="400" width="592" height="101" rx="15" fill="#fce5e2" stroke="#a5423b" stroke-width="2"/><text x="562" y="435" fill="#72231b" font-weight="bold">HOLD — no procurement or operational qualification</text><text x="562" y="466" fill="#72231b">Require independent accessibility, safety and field evidence</text></g>
