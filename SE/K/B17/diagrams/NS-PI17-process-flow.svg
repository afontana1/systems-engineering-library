<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 255" role="img" aria-labelledby="title desc"><title id="title">Synthetic change-to-evidence process</title><desc id="desc">A request enters analysis, evidence preparation, board review, implementation and verification. An incomplete review loops back to analysis, and a final verification leads to release. Cases failing the revision cap are held.</desc><rect width="980" height="255" rx="18" fill="#f3f9f8"/><g fill="#e4f3f1" stroke="#216b70" stroke-width="2"><rect x="20" y="87" width="136" height="57" rx="9"/><rect x="180" y="87" width="144" height="57" rx="9"/><rect x="350" y="87" width="140" height="57" rx="9"/><rect x="515" y="87" width="145" height="57" rx="9"/><rect x="686" y="87" width="136" height="57" rx="9"/><rect x="846" y="87" width="112" height="57" rx="9"/></g><g fill="#123f4d" font-family="sans-serif" font-size="16" text-anchor="middle"><text x="88" y="110">Intake and</text><text x="88" y="129">analysis</text><text x="252" y="110">Evidence</text><text x="252" y="129">preparation</text><text x="420" y="110">Authority</text><text x="420" y="129">review</text><text x="587" y="110">Implementation</text><text x="587" y="129">and change</text><text x="754" y="110">Verification</text><text x="754" y="129">and trace</text><text x="902" y="110">Release</text><text x="902" y="129">or hold</text></g><g fill="none" stroke="#276d70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M156 116H180m-7 -6 7 6 -7 6M324 116h26m-7 -6 7 6 -7 6M490 116h25m-7 -6 7 6 -7 6M660 116h26m-7 -6 7 6 -7 6M822 116h24m-7 -6 7 6 -7 6"/><path d="M420 87V35H88V87m-6 -7 6 7 6 -7" stroke-dasharray="7 5"/></g><g fill="#1b5a61" font-family="sans-serif" font-size="15"><text x="181" y="25">Incomplete review → controlled rework</text><text x="20" y="185">Every request ends in one terminal state. Critical evidence requirements cannot be bypassed in the model.</text><text x="20" y="215">Fictional, finite-resource, nonpreemptive teaching simulation; no operational verification or authorization.</text></g></svg>
