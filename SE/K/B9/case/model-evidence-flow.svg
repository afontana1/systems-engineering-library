<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">Book 9 model-based evidence flow</title><desc id="d">Stakeholder needs feed requirements; requirements allocate functions, analyses test feasibility, evidence records gate decisions and change control loops back to analysis.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#24777b"/></marker></defs><style>.b{fill:#edf7f6;stroke:#24777b;stroke-width:2}.h{fill:#173f52;font:bold 19px system-ui}.s{fill:#355260;font:14px system-ui}.e{stroke:#24777b;stroke-width:2.2;fill:none;marker-end:url(#a)}</style><rect width="1000" height="390" rx="12" fill="#fff"/><g><rect class="b" x="24" y="55" width="180" height="86" rx="12"/><text class="h" x="42" y="90">Needs</text><text class="s" x="42" y="117">N01–N04</text><rect class="b" x="224" y="55" width="180" height="86" rx="12"/><text class="h" x="242" y="90">Requirements</text><text class="s" x="242" y="117">R01–R06</text><rect class="b" x="424" y="55" width="180" height="86" rx="12"/><text class="h" x="442" y="90">Functions / ICD</text><text class="s" x="442" y="117">F01–F04; I01–I02</text><rect class="b" x="624" y="55" width="180" height="86" rx="12"/><text class="h" x="642" y="90">Analyses</text><text class="s" x="642" y="117">M01–M06</text><rect class="b" x="824" y="55" width="150" height="86" rx="12"/><text class="h" x="842" y="90">Evidence</text><text class="s" x="842" y="117">E01–E06</text><path class="e" d="M204 98 H224 M404 98 H424 M604 98 H624 M804 98 H824"/><rect class="b" x="334" y="222" width="320" height="106" rx="12"/><text class="h" x="354" y="256">Review &amp; change control</text><text class="s" x="354" y="285">CR-42: I02 charger change</text><text class="s" x="354" y="307">Recompute, reverify, reapprove</text><path class="e" d="M900 141 V275 H654"/><path class="e" d="M334 275 H314 V141"/></g></svg>