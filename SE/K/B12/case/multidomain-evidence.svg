<text x="401" y="150" font-size="18" font-weight="700">Speed regulator</text><text x="401" y="175" font-size="14">force command</text><text x="401" y="193" font-size="14">step &amp; saturation</text>
<text x="665" y="150" font-size="18" font-weight="700">Vehicle motion</text><text x="665" y="175" font-size="14">distance · speed</text><text x="665" y="193" font-size="14">wheel power · work</text>
<text x="922" y="150" font-size="18" font-weight="700">Battery energy</text><text x="922" y="175" font-size="14">SOC · DC load</text><text x="922" y="193" font-size="14">ohmic losses</text>
<text x="401" y="339" font-size="18" font-weight="700">Cooling pump</text><text x="401" y="364" font-size="14">mass flow · electric</text><text x="401" y="382" font-size="14">auxiliary load</text>
<text x="665" y="339" font-size="18" font-weight="700">Battery thermal</text><text x="665" y="364" font-size="14">bulk pack temperature</text><text x="665" y="382" font-size="14">heat in − heat out</text>
<text x="922" y="339" font-size="18" font-weight="700">Screen &amp; review</text><text x="922" y="364" font-size="14">reserve · temp · time</text><text x="922" y="382" font-size="14">HOLD for qualification</text>
</g>
