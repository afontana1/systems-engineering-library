<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="550" viewBox="0 0 1050 550" role="img" aria-labelledby="title desc">
<title id="title">NS-CPS12.1 coupled-vehicle model and credibility chain</title>
<desc id="desc">A left-to-right route and supervisor model couples speed, wheel force, battery electricity and thermal cooling. Outputs flow to requirements and an independent credibility review. Physical measurement and external integration remain missing.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#376d77"/></marker></defs>
<rect width="1050" height="550" rx="14" fill="#f6f9f9"/>
<g font-family="system-ui,Arial,sans-serif" font-size="17" fill="#153746">
<text x="36" y="40" font-weight="700" font-size="24">NS-CPS12.1 · physics → measures → bounded decision</text>
<text x="36" y="68" font-size="14" fill="#466573">Synthetic teaching architecture · not a conforming FMI/HLA or real-time implementation</text>
</g>
<g stroke="#7898a1" stroke-width="2" rx="10">
