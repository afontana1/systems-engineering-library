<text x="56" y="475" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#153746">Credibility gaps</text>
<text x="56" y="495" font-family="system-ui,Arial,sans-serif" font-size="14" fill="#425f6a">No route-elevation closure · no cell-gradient validation · no traffic/charging queues · no 10 ms / HIL / FMU conformance</text>
