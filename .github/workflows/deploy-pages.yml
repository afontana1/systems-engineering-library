name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate homepage from START-HERE
        run: python3 scripts/prepare_github_pages.py

      - name: Check library links and learning journeys
        run: python3 SE/INTERNAL/LEARNER-JOURNEY-CHECKS-v59.py

      - name: Check search behavior
        run: node SE/INTERNAL/SEARCH-v57-SMOKE.js

      - name: Assemble website
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R SE _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
